[project]
name = "modeldock-timm-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "modeldock-sdk==0.1.0",
    "timm==1.0.31",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "safetensors==0.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
modeldock-sdk = {path = "../../vendor/modeldock_sdk-0.1.0-py3-none-any.whl"}
torch = {index = "pytorch-cpu"}
torchvision = {index = "pytorch-cpu"}

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
