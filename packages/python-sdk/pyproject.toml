[project]
name = "modeldock-sdk"
version = "0.1.1"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<3", "pillow>=11,<13", "jsonschema>=4.23,<5", "packaging>=24,<27"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modeldock_sdk", "src/modeldock_worker"]
